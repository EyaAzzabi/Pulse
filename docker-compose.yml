services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/pulse.db
      DEMO_ENABLED: "true"
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - pulse-data:/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
volumes:
  pulse-data:
